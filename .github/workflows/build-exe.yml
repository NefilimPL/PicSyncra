name: Build Windows EXE

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  select-runner:
    name: Select Windows runners
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.select.outputs.runs_on }}
      runner_names: ${{ steps.select.outputs.runner_names }}
      using_self_hosted: ${{ steps.select.outputs.using_self_hosted }}
      available_count: ${{ steps.select.outputs.available_count }}

    steps:
      - name: Select GitHub Actions runners
        id: select
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.ACTIONS_RUNNER_READ_TOKEN || github.token }}
          script: |
            const fallbackRunsOn = JSON.stringify('windows-latest');
            const selfHostedLabels = ['self-hosted', 'Windows', 'X64'];

            function useFallback(message) {
              core.warning(message);
              core.setOutput('runs_on', fallbackRunsOn);
              core.setOutput('runner_names', 'windows-latest');
              core.setOutput('using_self_hosted', 'false');
              core.setOutput('available_count', '0');
            }

            try {
              const { owner, repo } = context.repo;
              const runners = await github.paginate(
                github.rest.actions.listSelfHostedRunnersForRepo,
                {
                  owner,
                  repo,
                  per_page: 100,
                },
              );
              const requiredLabels = selfHostedLabels.map((label) => label.toLowerCase());
              const onlineRunners = runners.filter((runner) => {
                const labels = new Set(
                  (runner.labels || []).map((label) => String(label.name).toLowerCase()),
                );
                return (
                  runner.status === "online" &&
                  requiredLabels.every((label) => labels.has(label))
                );
              });

              if (onlineRunners.length === 0) {
                useFallback(
                  'No online self-hosted Windows X64 runner was found. Falling back to windows-latest.',
                );
                return;
              }

              const runnerNames = onlineRunners
                .map((runner) => `${runner.name}${runner.busy ? ' (busy)' : ''}`)
                .join(', ');
              core.notice(`Using ${onlineRunners.length} online self-hosted runner(s): ${runnerNames}`);
              core.setOutput('runs_on', JSON.stringify(selfHostedLabels));
              core.setOutput('runner_names', runnerNames);
              core.setOutput('using_self_hosted', 'true');
              core.setOutput('available_count', String(onlineRunners.length));
            } catch (error) {
              useFallback(
                `Could not query self-hosted runners. Falling back to windows-latest. ${error.message}`,
              );
            }

      - name: Runner selection summary
        shell: bash
        run: |
          {
            echo "### Runner selection"
            echo ""
            echo "- Runners: ${{ steps.select.outputs.runner_names }}"
            echo "- Online matching self-hosted runners: ${{ steps.select.outputs.available_count }}"
            echo "- Self-hosted: ${{ steps.select.outputs.using_self_hosted }}"
            echo "- runs-on: \`${{ steps.select.outputs.runs_on }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build ${{ matrix.name }}
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: local
            name: desktop EXE
          - target: migrator
            name: standalone legacy migrator EXE
          - target: web
            name: web EXE without OCR
          - target: web-ocr
            name: web EXE with offline OCR

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        if: needs.select-runner.outputs.using_self_hosted != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve Python 3.x
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidatePaths = [System.Collections.Generic.List[string]]::new()

          Write-Host "Resolve Python diagnostics"
          Write-Host "User: $([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          Write-Host "PATH: $env:PATH"
          Write-Host "LocalAppData: $env:LOCALAPPDATA"
          Write-Host "ProgramFiles: $env:ProgramFiles"

          function Add-Candidate {
            param([string]$Path)
            if ([string]::IsNullOrWhiteSpace($Path)) {
              return
            }
            $candidate = $Path.Trim()
            if (-not $candidatePaths.Contains($candidate)) {
              $candidatePaths.Add($candidate)
            }
          }

          function Add-CandidateFromRoot {
            param(
              [string]$Root,
              [string]$RelativePath
            )
            if ([string]::IsNullOrWhiteSpace($Root)) {
              return
            }
            Add-Candidate (Join-Path $Root $RelativePath)
          }

          $versionsToTry = @("3.13", "3.12", "3.11")
          $versionDirNames = @{
            "3.13" = "Python313"
            "3.12" = "Python312"
            "3.11" = "Python311"
          }

          if ("${{ needs.select-runner.outputs.using_self_hosted }}" -eq "true") {
            if (Get-Command py -ErrorAction SilentlyContinue) {
              Write-Host "Found Python launcher: $((Get-Command py).Source)"
              & py -0p
              foreach ($versionToTry in $versionsToTry) {
                $pyPath = (& py "-$versionToTry" -c "import sys; print(sys.executable)" 2>$null | Select-Object -First 1)
                if (-not [string]::IsNullOrWhiteSpace($pyPath)) {
                  Add-Candidate $pyPath
                }
              }
            } else {
              Write-Host "Python launcher 'py' was not found in this runner process."
            }
          }

          if (Get-Command python -ErrorAction SilentlyContinue) {
            Write-Host "Found python command: $((Get-Command python).Source)"
            $pythonPath = (& python -c "import sys; print(sys.executable)" 2>$null | Select-Object -First 1)
            if (-not [string]::IsNullOrWhiteSpace($pythonPath)) {
              Add-Candidate $pythonPath
            }
          } else {
            Write-Host "Command 'python' was not found in this runner process."
          }

          foreach ($versionToTry in $versionsToTry) {
            foreach ($root in @("HKLM:\SOFTWARE\Python\PythonCore", "HKCU:\SOFTWARE\Python\PythonCore")) {
              $installPathKey = Join-Path $root "$versionToTry\InstallPath"
              if (Test-Path $installPathKey) {
                $installPath = Get-ItemProperty -Path $installPathKey -ErrorAction SilentlyContinue
                Add-Candidate $installPath.ExecutablePath
                Add-CandidateFromRoot $installPath.'(default)' "python.exe"
              }
            }

            $dirName = $versionDirNames[$versionToTry]
            Add-CandidateFromRoot $env:ProgramFiles "$dirName\python.exe"
            Add-CandidateFromRoot ${env:ProgramFiles(x86)} "$dirName-32\python.exe"
            Add-CandidateFromRoot $env:LOCALAPPDATA "Programs\Python\$dirName\python.exe"
            Add-CandidateFromRoot $env:USERPROFILE "AppData\Local\Programs\Python\$dirName\python.exe"
          }

          Write-Host "Python candidates:"
          foreach ($candidate in $candidatePaths) {
            Write-Host "  $candidate"
          }

          foreach ($candidate in $candidatePaths) {
            if (-not (Test-Path $candidate)) {
              Write-Host "Skipping missing candidate: $candidate"
              continue
            }
            $version = (& $candidate -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')" 2>$null | Select-Object -First 1)
            if ($versionsToTry.Contains($version)) {
              "PICSYNCRA_BASE_PYTHON=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              & $candidate --version
              exit 0
            }
            Write-Host "Rejected candidate: $candidate version=$version exit=$LASTEXITCODE"
          }

          throw "Python 3.13, 3.12 or 3.11 was not found. On a self-hosted Windows runner install Python 3.13 with: winget install -e --id Python.Python.3.13 --scope machine"

      - name: Create isolated build virtualenv
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $venvDir = Join-Path $env:RUNNER_TEMP "picsyncra-build-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}"
          if (Test-Path $venvDir) {
            Remove-Item -LiteralPath $venvDir -Recurse -Force
          }
          & $env:PICSYNCRA_BASE_PYTHON -m venv $venvDir
          $venvPython = Join-Path $venvDir "Scripts\python.exe"
          if (-not (Test-Path $venvPython)) {
            throw "Virtualenv Python was not created: $venvPython"
          }
          "PICSYNCRA_PYTHON=$venvPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $venvPython --version

      - name: Set release/build version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}"
          } elseif ("${{ github.ref }}" -like "refs/tags/*") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = "dev-${{ github.run_number }}"
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "dev-${{ github.run_number }}"
          }
          $assetVersion = $version -replace '[^A-Za-z0-9_.-]', '-'
          Set-Content -Path "picsyncra/VERSION" -Value $version -Encoding utf8
          "PICSYNCRA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PICSYNCRA_ASSET_VERSION=$assetVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies (pinned packager)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dependencyInstallAttempts = 3

          function Install-RequirementsWithRetry {
            param([string]$RequirementsPath)

            for ($attempt = 1; $attempt -le $dependencyInstallAttempts; $attempt++) {
              & $env:PICSYNCRA_PYTHON -m pip install --retries 5 --timeout 120 -r $RequirementsPath
              if ($LASTEXITCODE -eq 0) {
                return
              }
              if ($attempt -lt $dependencyInstallAttempts) {
                Write-Warning "Installing $RequirementsPath failed (attempt $attempt/$dependencyInstallAttempts); retrying in 15 seconds."
                Start-Sleep -Seconds 15
              }
            }
            throw "Dependency installation failed after $dependencyInstallAttempts attempts. Check the self-hosted runner's access to https://pypi.org/simple/."
          }

          & $env:PICSYNCRA_PYTHON -m pip install --upgrade pip --retries 5 --timeout 120
          if ($LASTEXITCODE -ne 0) { throw "Pip upgrade failed." }
          Install-RequirementsWithRetry "requirements-build.txt"
          if ("${{ matrix.target }}" -eq "web" -or "${{ matrix.target }}" -eq "web-ocr") {
            Install-RequirementsWithRetry "requirements-web.txt"
          }
          if ("${{ matrix.target }}" -eq "web-ocr") {
            & $env:PICSYNCRA_PYTHON -m pip uninstall --yes opencv-python opencv-python-headless opencv-contrib-python
            if ($LASTEXITCODE -ne 0) { throw "Removing conflicting OpenCV packages failed." }
            Install-RequirementsWithRetry "requirements-vision.txt"
          }

      - name: Prepare Windows icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "build/icons" -Force | Out-Null
          & $env:PICSYNCRA_PYTHON -c "from PIL import Image; Image.open(r'pic/PIC9_LOCAL.png').save(r'build/icons/PIC9_LOCAL.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)]); Image.open(r'pic/PIC9_WEB.png').save(r'build/icons/PIC9_WEB.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)]); Image.open(r'pic/PIC9_WEB-OCR.png').save(r'build/icons/PIC9_WEB-OCR.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Prepare Windows version metadata
        shell: pwsh
        run: |
          & $env:PICSYNCRA_PYTHON tools/generate_windows_version_info.py `
            --output "build/version-info/PicSyncra.version.txt" `
            --file-description "PicSyncra desktop application" `
            --internal-name "PicSyncra" `
            --original-filename "PicSyncra.exe"
          & $env:PICSYNCRA_PYTHON tools/generate_windows_version_info.py `
            --output "build/version-info/PicSyncra-WEB.version.txt" `
            --file-description "PicSyncra web manager" `
            --internal-name "PicSyncra-WEB" `
            --original-filename "PicSyncra-WEB.exe"
          & $env:PICSYNCRA_PYTHON tools/generate_windows_version_info.py `
            --output "build/version-info/PicSyncra-Migrator.version.txt" `
            --file-description "PicSyncra legacy SQLite migrator" `
            --internal-name "PicSyncra-Migrator" `
            --original-filename "PicSyncra-Migrator.exe"

      - name: Generate module build manifest
        shell: pwsh
        env:
          PICSYNCRA_SOURCE_REF: ${{ github.event_name == 'release' && github.event.release.target_commitish || github.ref_name }}
        run: |
          & $env:PICSYNCRA_PYTHON tools/generate_module_build_manifest.py `
            --repo-root "." `
            --build-variant "${{ matrix.target }}" `
            --source-ref "$env:PICSYNCRA_SOURCE_REF" `
            --output "build/module_build_manifest.json"

      - name: Build local EXE with PyInstaller
        if: matrix.target == 'local'
        shell: pwsh
        env:
          PICSYNCRA_HEADLESS: "1"
          PYINSTALLER_BUILD: "1"
        run: |
          & $env:PICSYNCRA_PYTHON -m PyInstaller --noconfirm --clean --log-level=WARN `
            --name PicSyncra `
            --noconsole `
            --onefile `
            --distpath "dist/output" `
            --workpath "build/output-local" `
            --icon "build/icons/PIC9_LOCAL.ico" `
            --version-file "build/version-info/PicSyncra.version.txt" `
            --collect-submodules mysql.connector `
            --collect-data mysql.connector `
            --collect-data certifi `
            --add-data "picsyncra/Localization;picsyncra/Localization" `
            --add-data "picsyncra/VERSION;picsyncra" `
            --add-data "build/module_build_manifest.json;picsyncra" `
            --add-data "pic/PIC9_LOCAL.png;pic" `
            PicSyncra.pyw
          Copy-Item -Path "picsyncra/Localization" -Destination "dist/output/Localization" -Recurse -Force
          Copy-Item -Path "picsyncra/VERSION" -Destination "dist/output/VERSION" -Force

      - name: Build migrator EXE with PyInstaller
        if: matrix.target == 'migrator'
        shell: pwsh
        env:
          PICSYNCRA_HEADLESS: "1"
          PYINSTALLER_BUILD: "1"
        run: |
          & $env:PICSYNCRA_PYTHON -m PyInstaller --noconfirm --clean --log-level=WARN `
            --name PicSyncra-Migrator `
            --noconsole `
            --onefile `
            --distpath "dist/output" `
            --workpath "build/output-migrator" `
            --icon "build/icons/PIC9_LOCAL.ico" `
            --version-file "build/version-info/PicSyncra-Migrator.version.txt" `
            --hidden-import picsyncra.offline_migrator_processes `
            --add-data "picsyncra/VERSION;picsyncra" `
            --add-data "build/module_build_manifest.json;picsyncra" `
            --add-data "pic/PIC9_LOCAL.png;pic" `
            PicSyncra-Migrator.pyw

      - name: Build web manager EXE with PyInstaller
        if: matrix.target == 'web' || matrix.target == 'web-ocr'
        shell: pwsh
        env:
          PICSYNCRA_HEADLESS: "1"
          PYINSTALLER_BUILD: "1"
        run: |
          $ocrArguments = @()
          if ("${{ matrix.target }}" -eq "web-ocr") {
            $modelCache = Join-Path $env:RUNNER_TEMP "picsyncra-ocr-model-cache-${{ github.run_id }}-${{ github.run_attempt }}"
            New-Item -ItemType Directory -Path $modelCache -Force | Out-Null
            $env:PADDLE_PDX_CACHE_HOME = $modelCache
            & $env:PICSYNCRA_PYTHON -c "from paddleocr import PaddleOCR; from picsyncra.services.ocr_profiles import available_ocr_profiles; [PaddleOCR(text_detection_model_name=profile.detector_model, text_recognition_model_name=profile.recognizer_model, enable_mkldnn=False, use_doc_orientation_classify=False, use_doc_unwarping=False, use_textline_orientation=False) for profile in available_ocr_profiles()]"
            if ($LASTEXITCODE -ne 0) { throw "Nie udalo sie przygotowac lokalnych modeli OCR." }
            & $env:PICSYNCRA_PYTHON -c "from picsyncra.services.image_dimensions import _model_cache_has_profile; from picsyncra.services.ocr_profiles import available_ocr_profiles; import os; missing = [profile.id for profile in available_ocr_profiles() if not _model_cache_has_profile(os.environ['PADDLE_PDX_CACHE_HOME'], profile)]; (_ for _ in ()).throw(RuntimeError('Brakuje modeli OCR: ' + ', '.join(missing))) if missing else None"
            if ($LASTEXITCODE -ne 0) { throw "Nie wszystkie lokalne profile OCR zostaly przygotowane." }
            foreach ($package in @("paddleocr", "paddlex", "paddle", "cv2", "bidi", "imagesize", "pyclipper", "pypdfium2", "shapely")) {
              $ocrArguments += "--collect-all"
              $ocrArguments += $package
            }
            $ocrArguments += "--add-data"
            $ocrArguments += "$modelCache;ocr_models"
          } else {
            $ocrArguments += "--runtime-hook"
            $ocrArguments += "Generator exe/disable_ocr_runtime.py"
          }
          $webIcon = if ("${{ matrix.target }}" -eq "web-ocr") { "build/icons/PIC9_WEB-OCR.ico" } else { "build/icons/PIC9_WEB.ico" }
          & $env:PICSYNCRA_PYTHON -m PyInstaller --noconfirm --clean --log-level=WARN `
            --name PicSyncra-WEB `
            --noconsole `
            --onefile `
            --distpath "dist/output" `
            --workpath "build/output-web" `
            --icon $webIcon `
            --version-file "build/version-info/PicSyncra-WEB.version.txt" `
            --collect-submodules picsyncra `
            --collect-submodules mysql.connector `
            --collect-submodules uvicorn `
            --collect-submodules fastapi `
            --collect-submodules starlette `
            --collect-submodules multipart `
            --collect-submodules pystray `
            --collect-submodules PIL `
            --collect-data mysql.connector `
            --collect-data certifi `
            @ocrArguments `
            --add-data "picsyncra/web/static;picsyncra/web/static" `
            --add-data "picsyncra/browser_extension;picsyncra/browser_extension" `
            --add-data "picsyncra/Localization;picsyncra/Localization" `
            --add-data "picsyncra/VERSION;picsyncra" `
            --add-data "build/module_build_manifest.json;picsyncra" `
            --add-data "pic/PIC9_WEB.png;pic" `
            --add-data "pic/PIC9_WEB-OCR.png;pic" `
            PicSyncra-WEB.pyw

      - name: Prepare local release asset
        if: github.event_name == 'release' && matrix.target == 'local'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/release" -Force | Out-Null
          Copy-Item -Path "dist/output/PicSyncra.exe" -Destination "dist/release/PicSyncra-$env:PICSYNCRA_ASSET_VERSION.exe" -Force

      - name: Prepare web release assets
        if: github.event_name == 'release' && (matrix.target == 'web' || matrix.target == 'web-ocr')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/release" -Force | Out-Null
          $webAssetName = if ("${{ matrix.target }}" -eq "web-ocr") { "PicSyncra-WEB-OCR-$env:PICSYNCRA_ASSET_VERSION.exe" } else { "PicSyncra-WEB-$env:PICSYNCRA_ASSET_VERSION.exe" }
          Copy-Item -Path "dist/output/PicSyncra-WEB.exe" -Destination "dist/release/$webAssetName" -Force

      - name: Prepare migrator release asset
        if: github.event_name == 'release' && matrix.target == 'migrator'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/release" -Force | Out-Null
          Copy-Item -Path "dist/output/PicSyncra-Migrator.exe" -Destination "dist/release/PicSyncra-Migrator-$env:PICSYNCRA_ASSET_VERSION.exe" -Force

      - name: Prepare artifact upload probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "build" -Force | Out-Null
          Set-Content -Path "build/artifact-upload-probe.txt" -Value "Artifact upload probe for $env:GITHUB_REPOSITORY run $env:GITHUB_RUN_ID target ${{ matrix.target }}" -Encoding utf8

      - name: Check artifact upload availability
        id: artifact-probe
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: PicSyncra-artifact-probe-${{ matrix.target }}-${{ github.run_id }}
          path: build/artifact-upload-probe.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows artifact
        id: upload-windows
        if: matrix.target == 'local' && steps.artifact-probe.outcome == 'success'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: PicSyncra-windows
          path: dist/output/PicSyncra.exe
          retention-days: 7

      - name: Upload migrator EXE artifact
        id: upload-migrator
        if: matrix.target == 'migrator' && steps.artifact-probe.outcome == 'success'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: PicSyncra-migrator
          path: dist/output/PicSyncra-Migrator.exe
          retention-days: 7

      - name: Upload web EXE artifact
        id: upload-web-exe
        if: (matrix.target == 'web' || matrix.target == 'web-ocr') && steps.artifact-probe.outcome == 'success'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: PicSyncra-web-exe-${{ matrix.target }}
          path: dist/output/PicSyncra-WEB.exe
          retention-days: 7

      - name: Report skipped artifact upload
        if: steps.artifact-probe.outcome != 'success'
        shell: pwsh
        run: |
          "Artifact upload was skipped for ${{ matrix.target }} because the upload probe failed. The EXE build completed; check upload-artifact logs for quota or permission details." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Report failed Windows artifact upload
        if: matrix.target == 'local' && steps.artifact-probe.outcome == 'success' && steps.upload-windows.outcome != 'success'
        shell: pwsh
        run: |
          "Artifact upload was skipped or failed for PicSyncra-windows. The EXE build completed; check upload-artifact logs for quota or permission details." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Report failed migrator artifact upload
        if: matrix.target == 'migrator' && steps.artifact-probe.outcome == 'success' && steps.upload-migrator.outcome != 'success'
        shell: pwsh
        run: |
          "Artifact upload was skipped or failed for PicSyncra-migrator. The EXE build completed; check upload-artifact logs for quota or permission details." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Report failed web artifact upload
        if: (matrix.target == 'web' || matrix.target == 'web-ocr') && steps.artifact-probe.outcome == 'success' && steps.upload-web-exe.outcome != 'success'
        shell: pwsh
        run: |
          "Artifact upload was skipped or failed for the web EXE. The EXE build completed; check upload-artifact logs for quota or permission details." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Publish local asset to release
        id: publish-local-release-asset
        if: github.event_name == 'release' && matrix.target == 'local'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const release_id = context.payload.release.id;
            const assetPaths = [
              `dist/release/PicSyncra-${process.env.PICSYNCRA_ASSET_VERSION}.exe`,
            ];
            const existingAssets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              { owner, repo, release_id, per_page: 100 },
            );
            for (const assetPath of assetPaths) {
              if (!fs.existsSync(assetPath)) {
                throw new Error(`Release asset file does not exist: ${assetPath}`);
              }
              const name = path.basename(assetPath);
              const existing = existingAssets.find((asset) => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              }
              const data = fs.readFileSync(assetPath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id,
                name,
                data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
              });
            }

      - name: Publish web asset to release
        id: publish-web-release-asset
        if: github.event_name == 'release' && matrix.target == 'web'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const release_id = context.payload.release.id;
            const assetPaths = [
              `dist/release/PicSyncra-WEB-${process.env.PICSYNCRA_ASSET_VERSION}.exe`,
            ];
            const existingAssets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              { owner, repo, release_id, per_page: 100 },
            );
            for (const assetPath of assetPaths) {
              if (!fs.existsSync(assetPath)) {
                throw new Error(`Release asset file does not exist: ${assetPath}`);
              }
              const name = path.basename(assetPath);
              const existing = existingAssets.find((asset) => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              }
              const data = fs.readFileSync(assetPath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id,
                name,
                data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
              });
            }

      - name: Publish OCR web asset to release
        id: publish-ocr-web-release-asset
        if: github.event_name == 'release' && matrix.target == 'web-ocr'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          $ErrorActionPreference = "Stop"
          $assetPath = "dist/release/PicSyncra-WEB-OCR-$env:PICSYNCRA_ASSET_VERSION.exe"
          if (-not (Test-Path $assetPath)) {
            throw "Release asset file does not exist: $assetPath"
          }
          $assetName = [System.IO.Path]::GetFileName($assetPath)
          $assetSize = (Get-Item -LiteralPath $assetPath).Length
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "PicSyncra-release-upload"
          }
          $releaseUrl = "$env:GITHUB_API_URL/repos/${{ github.repository }}/releases/${{ github.event.release.id }}"
          $release = Invoke-RestMethod -Method Get -Uri $releaseUrl -Headers $headers
          $assetsUrl = "$($release.assets_url)?per_page=100"
          $uploadUrl = ([string]$release.upload_url -replace '\{\?name,label\}$', "")
          $uploadUri = $null
          if (
            -not [Uri]::TryCreate($uploadUrl, [UriKind]::Absolute, [ref]$uploadUri) -or
            $uploadUri.Scheme -ne "https"
          ) {
            throw "Invalid release upload URL returned by GitHub API."
          }

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $existingAssets = @(Invoke-RestMethod -Method Get -Uri $assetsUrl -Headers $headers)
            $existingAsset = $existingAssets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
            if ($existingAsset -and $existingAsset.state -eq "uploaded" -and $existingAsset.size -eq $assetSize) {
              Write-Host "Release asset already uploaded: $assetName"
              exit 0
            }
            if ($existingAsset) {
              Invoke-RestMethod -Method Delete -Uri $existingAsset.url -Headers $headers
            }

            try {
              $encodedAssetName = [System.Uri]::EscapeDataString($assetName)
              Invoke-WebRequest -Method Post -Uri "$uploadUrl?name=$encodedAssetName" -Headers $headers -ContentType "application/octet-stream" -InFile $assetPath -TimeoutSec 1800 | Out-Null
              exit 0
            } catch {
              if ($attempt -eq 3) {
                throw
              }
              Write-Warning "OCR release upload failed (attempt $attempt/3): $($_.Exception.Message)"
              Start-Sleep -Seconds 20
            }
          }

      - name: Publish migrator asset to release
        id: publish-migrator-release-asset
        if: github.event_name == 'release' && matrix.target == 'migrator'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const release_id = context.payload.release.id;
            const assetPath = `dist/release/PicSyncra-Migrator-${process.env.PICSYNCRA_ASSET_VERSION}.exe`;
            if (!fs.existsSync(assetPath)) {
              throw new Error(`Release asset file does not exist: ${assetPath}`);
            }
            const name = path.basename(assetPath);
            const existingAssets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              { owner, repo, release_id, per_page: 100 },
            );
            const existing = existingAssets.find((asset) => asset.name === name);
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
            }
            const data = fs.readFileSync(assetPath);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id,
              name,
              data,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': data.length,
              },
            });

      - name: Report skipped local release asset upload
        if: github.event_name == 'release' && matrix.target == 'local' && steps.publish-local-release-asset.outcome != 'success'
        shell: pwsh
        run: |
          "Release asset upload was skipped or failed for the local EXE. The EXE build completed; check GitHub API upload logs for quota or permission details." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Report skipped web release asset upload
        if: github.event_name == 'release' && matrix.target == 'web' && steps.publish-web-release-asset.outcome != 'success'
        shell: pwsh
        run: |
          "Release asset upload was skipped or failed for PicSyncra-WEB. The EXE build completed; check GitHub API upload logs for quota or permission details." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Report skipped OCR web release asset upload
        if: github.event_name == 'release' && matrix.target == 'web-ocr' && steps.publish-ocr-web-release-asset.outcome != 'success'
        shell: pwsh
        run: |
          "Release asset upload was skipped or failed for PicSyncra-WEB-OCR after three extended-timeout attempts. The EXE build completed; check upload logs and runner network connectivity." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Report skipped migrator release asset upload
        if: github.event_name == 'release' && matrix.target == 'migrator' && steps.publish-migrator-release-asset.outcome != 'success'
        shell: pwsh
        run: |
          "Release asset upload was skipped or failed for PicSyncra-Migrator. The EXE build completed; check GitHub API upload logs for quota or permission details." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
